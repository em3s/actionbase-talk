name: Sync slides from issue

on:
  workflow_dispatch:
    inputs:
      talk:
        description: 'Talk number (e.g. 1)'
        required: true
        default: '1'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve issue and write slides
        env:
          GH_TOKEN: ${{ github.token }}
          TALK: ${{ inputs.talk }}
        run: |
          set -euo pipefail
          TALK_DIR="talks/talk${TALK}"
          ISSUE_FILE="${TALK_DIR}/issue"
          DEST="${TALK_DIR}/slides.md"

          if [ ! -f "$ISSUE_FILE" ]; then
            echo "::error::Missing issue mapping at $ISSUE_FILE"
            exit 1
          fi

          ISSUE_NUMBER=$(tr -d '[:space:]' < "$ISSUE_FILE")
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::$ISSUE_FILE does not contain a valid issue number"
            exit 1
          fi

          echo "Syncing from issue #${ISSUE_NUMBER} → ${DEST}"
          gh issue view "$ISSUE_NUMBER" --json body --jq '.body' > "$DEST"
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"

      - name: Commit and push
        env:
          TALK: ${{ inputs.talk }}
        run: |
          set -euo pipefail
          DEST="talks/talk${TALK}/slides.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync talk${TALK} slides from issue #${ISSUE_NUMBER}"
          git push
