name: Sync slides from issues

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync all talks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          for issue_file in talks/*/issue; do
            talk_dir=$(dirname "$issue_file")
            dest="${talk_dir}/slides.md"

            issue_number=$(tr -d '[:space:]' < "$issue_file")
            if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
              echo "::warning::${issue_file} does not contain a valid issue number — skipping"
              continue
            fi

            echo "Syncing issue #${issue_number} → ${dest}"
            gh issue view "$issue_number" --json body --jq '.body' > "$dest"
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talks/*/slides.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync slides from issues"
          git push
